[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carve"
version = "1.0.0"
description = "Counterfactual audit and hardening for CCTV traffic accident detectors via matched, quality-gated video quartets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "traffic-accident-detection",
    "video-anomaly-detection",
    "counterfactual-editing",
    "robustness-auditing",
    "cctv",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.1",
    "transformers>=4.38",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["carve*"]
